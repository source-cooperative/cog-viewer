name: Claude Auto Review

# Thin caller for the org-wide review workflow in source-cooperative/.github.
# Only the trigger, permissions, and secret passthrough live here; the prompt,
# concurrency, and action version are shared. See that repo's README.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # The action can't validate or run against modified workflow files and
    # fails with "401 Unauthorized - Workflow validation failed".
    paths-ignore:
      - '.github/workflows/**'

jobs:
  review:
    uses: source-cooperative/.github/.github/workflows/claude-pr-review.yml@main
    # Must be granted here: a called workflow can only maintain or reduce the
    # caller's token permissions, never elevate them.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
