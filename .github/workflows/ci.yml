name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit tests + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  analyze-failure:
    name: Analyze failure
    needs: [unit, e2e]
    # Only on PRs — push-to-main failures have no PR to comment on.
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            CI failed on PR #${{ github.event.pull_request.number }}.

            1. Run `gh run view ${{ github.run_id }} --log-failed` to read the exact failing output.
            2. Run `git log --oneline -5` and `git diff origin/${{ github.base_ref }}...HEAD --stat` to understand what changed.
            3. Identify the root cause and fix it by editing the relevant source files.
            4. Verify the fix locally: run `pnpm test` for unit failures or `pnpm build` for build failures. Do NOT run `pnpm test:e2e` (no browser in this environment).
            5. Commit with `git add <files> && git commit -m "fix: <short description>"` and push with `git push`.
            6. Post a PR comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."` summarising what failed, what you changed, and why.
